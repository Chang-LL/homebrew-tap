name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linuxbrew:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # main 2026-08-16
      - name: Audit formula style
        run: brew style Formula/agent-root-broker.rb
      - name: Install and test formula
        run: |
          brew info Chang-LL/tap/rootbroker
          brew install Chang-LL/tap/agent-root-broker
          rootbroker version
          rootbroker-setup --help
          brew test Chang-LL/tap/agent-root-broker
          test ! -e /var/lib/rootbroker/install-state
